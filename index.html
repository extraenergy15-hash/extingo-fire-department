<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Extingo Fire Department — Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --ink: #eef1f4;
    --ink-dim: #99a2ad;
    --bg: #10131a;
    --bg-grid: #171b23;
    --card: #191d25;
    --card-edge: #262b34;
    --ember: #ff5a29;
    --ember-dim: #c74620;
    --brass: #d8ab52;
    --danger: #ff6b5e;
    --focus: #ff5a29;

    --font-display: "Oswald", "Arial Narrow", sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 18% 15%, rgba(255, 90, 41, 0.08), transparent 42%),
      radial-gradient(circle at 85% 82%, rgba(216, 171, 82, 0.06), transparent 45%),
      repeating-linear-gradient(
        135deg,
        var(--bg) 0px,
        var(--bg) 26px,
        var(--bg-grid) 26px,
        var(--bg-grid) 27px
      );
    font-family: var(--font-body);
    color: var(--ink);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }

  .ticket {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 4px;
    padding: 40px 32px 32px;
    box-shadow:
      0 30px 60px -20px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(255, 255, 255, 0.02) inset;
  }

  /* Torn / serrated top edge, like a tear-off dispatch slip */
  .ticket::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 0;
    right: 0;
    height: 12px;
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-bottom: none;
    clip-path: polygon(
      0% 100%, 4% 20%, 8% 100%, 12% 20%, 16% 100%, 20% 20%, 24% 100%,
      28% 20%, 32% 100%, 36% 20%, 40% 100%, 44% 20%, 48% 100%, 52% 20%,
      56% 100%, 60% 20%, 64% 100%, 68% 20%, 72% 100%, 76% 20%, 80% 100%,
      84% 20%, 88% 100%, 92% 20%, 96% 100%, 100% 20%, 100% 100%
    );
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 18px;
  }

  .beacon {
    position: relative;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--ember);
    box-shadow: 0 0 0 0 rgba(255, 90, 41, 0.6);
    animation: pulse 1.8s ease-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0% {
      box-shadow: 0 0 0 0 rgba(255, 90, 41, 0.55);
    }
    70% {
      box-shadow: 0 0 0 9px rgba(255, 90, 41, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(255, 90, 41, 0);
    }
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 27px;
    letter-spacing: 0.01em;
    line-height: 1.15;
    margin: 0 0 10px;
    text-transform: uppercase;
  }

  .subtitle {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-dim);
    margin: 0 0 28px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }

  .field-wrap {
    margin-bottom: 0;
  }

  input#passcode {
    width: 100%;
    padding: 13px 14px;
    background: #10131a;
    border: 1px solid var(--card-edge);
    border-radius: 3px;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 16px;
    letter-spacing: 0.12em;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input#passcode::placeholder {
    color: #4a515c;
    letter-spacing: 0.04em;
  }

  input#passcode:focus {
    border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(255, 90, 41, 0.16);
  }

  form.has-error input#passcode {
    border-color: var(--danger);
    animation: shake 0.32s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .gate-error {
    min-height: 18px;
    font-size: 13px;
    color: var(--danger);
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .gate-error.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  button#submit-btn {
    margin-top: 4px;
    padding: 13px 16px;
    border: none;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--ember) 0%, var(--ember-dim) 100%);
    color: #17100b;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }

  button#submit-btn:hover {
    filter: brightness(1.08);
  }

  button#submit-btn:active {
    transform: translateY(1px);
  }

  button#submit-btn:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  button#submit-btn:disabled {
    cursor: progress;
    filter: saturate(0.6);
  }

  button#submit-btn.is-checking::after {
    content: "…";
  }

  .footnote {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px dashed var(--card-edge);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #545c67;
    text-align: center;
  }
</style>
</head>
<body>

  <main class="ticket">
    <p class="eyebrow"><span class="beacon" aria-hidden="true"></span> Dispatch Access · Unit 12</p>
    <h1>Fire Department Access</h1>
    <p class="subtitle">Enter the station passcode to reach the department dashboard.</p>

    <form id="gate-form" novalidate>
      <div class="field-wrap">
        <label for="passcode">Passcode</label>
        <input
          type="password"
          id="passcode"
          name="passcode"
          autocomplete="off"
          placeholder="••••••••••"
          autofocus
        />
      </div>
      <p class="gate-error" id="gate-error" role="alert" aria-live="polite"></p>
      <button type="submit" id="submit-btn">Unlock Dashboard</button>
    </form>

    <p class="footnote">Authorized personnel only · Extingo FD</p>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
